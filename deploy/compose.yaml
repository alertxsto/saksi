# Saksi web container. Started by deploy/deploy.sh, which builds saksi-web:<tag> from web/Dockerfile
# and writes deploy/.env (SAKSI_TAG, SAKSI_ENV_FILE) so plain commands work from this directory:
#   docker compose ps | logs -f web | restart web
# Host Caddy proxies saksiku.web.id to 127.0.0.1:3400 (deploy/Caddyfile.saksi).
name: saksi

services:
  web:
    image: saksi-web:${SAKSI_TAG:?SAKSI_TAG is not set; run deploy/deploy.sh or set it in deploy/.env}
    pull_policy: never
    env_file:
      - path: ${SAKSI_ENV_FILE:-../web/.env.production}
        required: true
    # These win over the env file, so it cannot move the server off the published port.
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: 0.0.0.0
      # Keep the V8 heap below mem_limit so Node collects garbage before the OOM killer acts.
      NODE_OPTIONS: --max-old-space-size=640
    ports:
      - "127.0.0.1:3400:3000"
    depends_on:
      db:
        condition: service_healthy
    # Lets AI_BASE_URL point at an OpenAI-compatible service on the VM itself
    # (http://host.docker.internal:<port>/v1). The host firewall must accept that port from the
    # saksi network below; see deploy/README.md.
    extra_hosts:
      - host.docker.internal:host-gateway
    restart: unless-stopped
    init: true
    stop_grace_period: 20s
    mem_limit: 1g
    memswap_limit: 1g
    pids_limit: 256
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
      # Next.js cache directory; the image itself is owned by root and not writable (uid 1000 = node).
      - /app/.next/cache:size=64m,uid=1000,gid=1000,mode=0700
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  # Postgres for the app, reachable only from the compose network (no published port).
  # DATABASE_URL in the env file: postgres://saksi:<POSTGRES_PASSWORD>@db:5432/saksi
  # deploy/db/*.sql creates the schema the first time the volume is initialised.
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: saksi
      POSTGRES_DB: saksi
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is not set; deploy.sh reads it from the env file}
    volumes:
      - saksi-db:/var/lib/postgresql/data
      - ./db:/docker-entrypoint-initdb.d:ro
    restart: unless-stopped
    mem_limit: 512m
    shm_size: 128m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U saksi -d saksi"]
      interval: 5s
      timeout: 3s
      retries: 20
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  saksi-db:

# Fixed subnet so a host firewall rule can allow exactly this network.
networks:
  default:
    ipam:
      config:
        - subnet: 172.31.250.0/24
